<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bandas | Bandas MX</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-md bg-white">
      <div class="container">
        <a class="navbar-brand" href="index.html">Bandas MX</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="bandas.html">Bandas</a></li>
            <li class="nav-item"><a class="nav-link" href="formulario.html">Agregar banda</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="py-5">
    <div class="container">

      <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
          <h1 class="mb-1">Bandas</h1>
          <p class="texto-suave mb-0" id="contador">Cargando…</p>
        </div>
        <a href="formulario.html" class="btn btn-dark">Agregar banda</a>
      </div>

      <!-- Búsqueda por nombre -->
      <form role="search" class="mb-4" id="formBusqueda">
        <label for="busqueda" class="form-label visually-hidden">Buscar banda por nombre</label>
        <input type="search" id="busqueda" class="form-control form-control-lg"
               placeholder="Buscar por nombre…" autocomplete="off">
      </form>

      <div id="alertas"></div>

      <!-- Aquí se insertan las tarjetas con JavaScript -->
      <section class="row g-4" id="listaBandas" aria-live="polite"></section>

      <p class="texto-suave text-center py-5 d-none" id="sinResultados"></p>
    </div>
  </main>

  <!-- Modal de confirmación para eliminar -->
  <div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="tituloModalEliminar" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="tituloModalEliminar">Eliminar banda</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          ¿Seguro que quieres eliminar <strong id="nombreEliminar"></strong>?
          Se borrarán también su foto y su discografía. Esta acción no se puede deshacer.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-4">
    <div class="container texto-suave">Bandas MX · Proyecto Final de Programación Web</div>
  </footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/bandas.js"></script>
</body>
</html>
