<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle | Bandas MX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-md bg-white">
      <div class="container">
        <a class="navbar-brand" href="index.html">Bandas MX</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link active" href="bandas.html">Bandas</a></li>
            <li class="nav-item"><a class="nav-link" href="formulario.html">Agregar banda</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="py-5">
    <div class="container">
      <a href="bandas.html" class="link-dark small">← Volver al listado</a>

      <div id="alertas" class="mt-3"></div>

      <p class="texto-suave mt-4" id="cargando">Cargando…</p>

      <!-- Se llena con JavaScript -->
      <article class="row g-5 mt-0 d-none" id="detalle">
        <div class="col-md-5">
          <img id="foto" class="foto-detalle" src="" alt="">
        </div>
        <div class="col-md-7">
          <span class="etiqueta" id="genero"></span>
          <h1 class="display-5 mt-3 mb-1" id="nombre"></h1>
          <p class="texto-suave" id="ciudad"></p>

          <div class="d-flex gap-2 my-4">
            <a href="#" class="btn btn-dark" id="btnEditar">Editar</a>
            <button type="button" class="btn btn-outline-danger" id="btnEliminar">Eliminar</button>
          </div>

          <h2 class="h5 mt-5">Discografía</h2>
          <ul class="list-unstyled lista-discos" id="discos"></ul>
        </div>
      </article>
    </div>
  </main>

  <!-- Modal de confirmación para eliminar -->
  <div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="tituloModalEliminar" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="tituloModalEliminar">Eliminar banda</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          ¿Seguro que quieres eliminar <strong id="nombreEliminar"></strong>?
          Se borrarán también su foto y su discografía. Esta acción no se puede deshacer.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-4">
    <div class="container texto-suave">Bandas MX · Proyecto Final de Programación Web</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/detalle.js"></script>
</body>
</html>
